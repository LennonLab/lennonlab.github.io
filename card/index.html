<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#990000">
  <meta name="description" content="Jay T. Lennon — Distinguished Professor of Biology at Indiana University and Principal Investigator of the Lennon Lab.">
  <title>Jay T. Lennon | Contact</title>
  <style>
    :root { color-scheme: light; --iu-crimson: #990000; --ink: #20242a; --muted: #59616a; --paper: #f4f3ef; --line: #e1e0dc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 18px; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 520px); overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 16px 48px rgb(32 36 42 / 8%); }
    .accent { height: 8px; background: var(--iu-crimson); }
    .content { padding: 30px clamp(22px, 6vw, 38px) 26px; }
    .identity { display: flex; align-items: center; gap: 20px; }
    .portrait { width: 92px; height: 92px; flex: 0 0 92px; border-radius: 16px; object-fit: cover; background: #ecebea; }
    h1 { margin: 0; font-size: clamp(1.7rem, 6vw, 2.15rem); line-height: 1.12; letter-spacing: -.035em; }
    .role { margin: 8px 0 2px; font-weight: 650; }
    .affiliation { margin: 0; color: var(--muted); }
    .research { margin: 24px 0 0; color: var(--muted); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 24px 0 0; }
    .button { min-height: 48px; display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: #fff; text-align: center; text-decoration: none; font-weight: 650; }
    .button.primary { border-color: var(--iu-crimson); background: var(--iu-crimson); color: #fff; }
    .button:hover { filter: brightness(.96); }
    .button:focus-visible, a:focus-visible { outline: 3px solid #d6a2a2; outline-offset: 3px; }
    .details { margin: 24px 0 0; border-top: 1px solid var(--line); }
    .details a { display: flex; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
    .details a span:first-child { color: var(--muted); }
    .details a span:last-child { text-align: right; }
    nav { display: flex; flex-wrap: wrap; gap: 10px 18px; margin: 22px 0 0; }
    nav a { color: var(--iu-crimson); font-weight: 600; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    footer { padding: 14px 24px; border-top: 1px solid var(--line); color: var(--muted); text-align: center; font-size: .85rem; }
    footer a { color: inherit; }
    @media (max-width: 380px) { .identity { align-items: flex-start; gap: 14px; } .portrait { width: 72px; height: 72px; flex-basis: 72px; border-radius: 12px; } }
    @media (prefers-reduced-motion: no-preference) { .button { transition: filter .15s ease; } }
  </style>
</head>
<body>
  <main>
    <div class="accent" aria-hidden="true"></div>
    <div class="content">
      <header class="identity">
        <img class="portrait" src="https://lennonlab.github.io/assets/images/JayHead.png" alt="Jay T. Lennon" width="184" height="184">
        <div>
          <h1>Jay T. Lennon</h1>
          <p class="role">Distinguished Professor of Biology</p>
          <p class="affiliation">Indiana University</p>
        </div>
      </header>
      <p class="affiliation">Chair, Scientific Unit on Applied and Environmental Microbiology, ASM</p>
      <div class="actions">
        <a class="button primary" href="mailto:lennonj@iu.edu">Email Jay</a>
        <button class="button" id="save-contact" type="button">Save Contact</button>
      </div>
      <div class="details" aria-label="Contact details">
        <a href="tel:+18128560962"><span>Office</span><span>812-856-0962</span></a>
        <a href="mailto:lennonj@iu.edu"><span>Email</span><span>lennonj@iu.edu</span></a>
      </div>
      <nav aria-label="Professional links">
        <a href="https://lennonlab.github.io/">Lennon Lab</a>
        <a href="https://lennon.lab.iu.edu/i">Lab wiki</a>
        <a href="https://orcid.org/0000-0003-3126-6111">ORCID</a>
        <a href="https://goo.gl/qx4hHR">Google Scholar</a>
        <a href="https://lennonlab.github.io/assets/docs/Lennon_CV.pdf">CV</a>
      </nav>
    </div>
  </main>
  <script>
    document.getElementById('save-contact').addEventListener('click', () => {
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Lennon;Jay;T.;;',
        'FN:Jay T. Lennon',
        'ORG:Indiana University;Department of Biology',
        'TITLE:Distinguished Professor of Biology',
        'ROLE:Chair, Scientific Unit on Applied and Environmental Microbiology, ASM',
        'TEL;TYPE=WORK,VOICE:+1-812-856-0962',
        'EMAIL;TYPE=WORK:lennonj@iu.edu',
        'URL:https://lennonlab.github.io/',
        'URL;TYPE=ORCID:https://orcid.org/0000-0003-3126-6111',
        'END:VCARD'
      ].join('\r\n') + '\r\n';
      const file = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(file);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'Jay-T-Lennon.vcf';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
